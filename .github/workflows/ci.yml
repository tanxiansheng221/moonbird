name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MoonBit
        uses: moonbitlang/setup-moonbit@v1
      - name: Toolchain version
        run: moonc -v && moon version --all
      - name: Test (workspace: birdcore + webgame + maze)
        working-directory: wasm4demo
        run: moon test
      - name: Build webgame (js target)
        working-directory: wasm4demo
        run: moon build --target js --release
      - name: Build maze (wasm-gc)
        working-directory: wasm4demo
        run: moon build --target wasm-gc --release
